<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Pear Voice Chat</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #10151c;
        color: white;
      }
      h1 {
        font-size: 40px;
      }
      button {
        display: none;
        margin-top: 20px;
        padding: 12px 24px;
        font-size: 18px;
        border: 2px solid white;
        border-radius: 8px;
        background: green;
        color: white;
        cursor: pointer;
      }
      button:hover {
        background: #4a90e2;
      }
      .container {
        width: min(680px, 90vw);
      }
      .status {
        padding: 16px;
        border: 1px solid #344150;
        border-radius: 8px;
        background: #19212b;
      }
      pre {
        min-height: 120px;
        white-space: pre-wrap;
        color: #b9c7d8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Pear Voice Chat</h1>
      <p>Linux implementation scaffold</p>
      <div class="status">
        <strong id="status">Starting worker...</strong>
        <pre id="log"></pre>
      </div>
      <button id="update-btn">Apply update</button>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
